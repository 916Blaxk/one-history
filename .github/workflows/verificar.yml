name: Verificar

on:
  push:
    branches: [main, mesa-unificada]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    # O Playwright usa o Edge instalado, que já vem no Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build
      - run: npx vitest run
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: resultado-dos-testes
          path: test-results/
          retention-days: 7
